name: Cosmic F14 reconnect session-rebind source guard
on:
  push:
    branches:
      - feature/cs01-core17-f14-session-rebind-20261112
  pull_request:
    paths:
      - src/server/game/Handlers/CharacterHandler.cpp
      - src/server/game/Scripting/ScriptDefines/PlayerScript.cpp
      - src/server/game/Scripting/ScriptDefines/PlayerScript.h
      - src/server/game/Scripting/ScriptMgr.h
      - tests/cosmic_f14_session_rebind/test_f14_session_rebind_source.py
      - .github/workflows/cosmic-f14-session-rebind-source.yml
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/cosmic_f14_session_rebind/test_f14_session_rebind_source.py