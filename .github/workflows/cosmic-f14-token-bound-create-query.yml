name: Cosmic F14 token-bound initial CREATE query
on:
  push:
    branches:
      - feature/cs01-core19-f14-token-bound-create-query-20261112
  pull_request:
    paths:
      - src/server/game/Entities/Object/Updates/UpdateData.h
      - src/server/game/Entities/Player/PlayerUpdates.cpp
      - src/server/game/Scripting/ScriptDefines/WorldObjectScript.cpp
      - src/server/game/Scripting/ScriptDefines/WorldObjectScript.h
      - src/server/game/Scripting/ScriptMgr.h
      - tests/cosmic_f14_token_bound_create/test_f14_token_bound_create_source.py
      - .github/workflows/cosmic-f14-token-bound-create-query.yml
jobs:
  source-and-admission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/cosmic_f14_token_bound_create/test_f14_token_bound_create_source.py
      - name: Re-run non-transferable notifier admission token model
        run: |
          ${{ matrix.compiler }} -std=${{ matrix.standard }} -Wall -Wextra -Werror \
            -Isrc/server/game/Entities/Object/Updates \
            tests/cosmic_f14_token_bound_out/f14_initial_out_token_test.cpp \
            -o /tmp/f14_visibility_pass_token_test
          /tmp/f14_visibility_pass_token_test