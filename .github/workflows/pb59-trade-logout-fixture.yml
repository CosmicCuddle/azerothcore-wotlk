# Isolated PB59 review-branch regression workflow. Does not interact with servers or databases.
name: PB59 transaction admission regression fixtures

on:
  pull_request:
    branches:
      - feature/cs01-pb59-pending-logout-admission-20261117
      - feature/cs01-pb59-trade-logout-admission-fixture-20261117
      - feature/cs01-pb59-mutation-scope-lifetime-20261117
      - feature/cs01-pb59-economic-scope-admission-20261117
    paths:
      - tests/pb59/**
      - src/server/game/Entities/Player/PB59TransactionAdmission.h
      - .github/workflows/pb59-trade-logout-fixture.yml
  push:
    branches:
      - feature/cs01-pb59-trade-logout-admission-fixture-20261117
      - feature/cs01-pb59-mutation-scope-lifetime-20261117
      - feature/cs01-pb59-economic-scope-admission-20261117
      - feature/cs01-pb59-external-save-deferral-20261117
    paths:
      - tests/pb59/pb59_trade_logout_owned_scope.cpp
      - tests/pb59/test_trade_logout_owned_scope.py
      - tests/pb59/pb59_mutation_scope_lifetime.cpp
      - tests/pb59/test_mutation_scope_lifetime.py
      - tests/pb59/pb59_economic_scope_admission.cpp
      - tests/pb59/test_economic_scope_admission.py
      - tests/pb59/pb59_external_save_deferral.cpp
      - tests/pb59/test_external_save_deferral.py
      - tests/pb59/pb59_pending_logout_admission.cpp
      - tests/pb59/test_pending_logout_admission.py
      - src/server/game/Entities/Player/PB59TransactionAdmission.h
      - .github/workflows/pb59-trade-logout-fixture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pb59-owned-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-header-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        sanitize: [false, true]
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show compiler and pinned source revision
        run: |
          git rev-parse HEAD
          ${{ matrix.cxx }} --version | head -n 1
          git hash-object src/server/game/Entities/Player/PB59TransactionAdmission.h
      - name: Execute ledger admission, two-party and owner lifetime fixtures
        env:
          CXX: ${{ matrix.cxx }}
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          if [ "$SANITIZE" = "true" ]; then
            python3 tests/pb59/test_trade_logout_owned_scope.py --cxx "$CXX" --sanitize
            python3 tests/pb59/test_pending_logout_admission.py --cxx "$CXX" --sanitize
            python3 tests/pb59/test_mutation_scope_lifetime.py --cxx "$CXX" --sanitize
            python3 tests/pb59/test_economic_scope_admission.py --cxx "$CXX" --sanitize
            python3 tests/pb59/test_external_save_deferral.py --cxx "$CXX" --sanitize
          else
            python3 tests/pb59/test_trade_logout_owned_scope.py --cxx "$CXX"
            python3 tests/pb59/test_pending_logout_admission.py --cxx "$CXX"
            python3 tests/pb59/test_mutation_scope_lifetime.py --cxx "$CXX"
            python3 tests/pb59/test_economic_scope_admission.py --cxx "$CXX"
            python3 tests/pb59/test_external_save_deferral.py --cxx "$CXX"
          fi
